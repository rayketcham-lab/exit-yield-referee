[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-yield-referee"
version = "0.1.0"
description = "Sweeps idle stablecoins only when net yield beats exit penalty and fees."
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.0.0"]
dev = ["ruff>=0.15.0"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]